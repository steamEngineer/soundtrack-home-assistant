# Lab config for the Soundtrack integration. Not a production Home Assistant config.
# The HTTP port is not set here. Home Assistant 2026 stores it, and a YAML port
# is only a five-minute trial that falls back to 8123. See dev/http.storage.json.
homeassistant:
  name: Soundtrack Lab
  latitude: 32.87336
  longitude: -117.22743
  elevation: 0
  unit_system: metric
  time_zone: UTC
  country: US

frontend:

logger:
  default: warning
  logs:
    custom_components.soundtrack: info
